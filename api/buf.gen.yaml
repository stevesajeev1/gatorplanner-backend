version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/stevesajeev1/gatorplanner-backend/generated
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: generated
    opt:
      - paths=source_relative
  - local: ["go", "tool", "protoc-gen-go-grpc"]
    out: generated
    opt:
      - paths=source_relative
inputs:
  - directory: proto