syntax = "proto3";

package scheduler.v1;

service SchedulerService {
  rpc GenerateSchedules(GenerateSchedulesRequest) returns (GenerateSchedulesResponse);
}

message GenerateSchedulesRequest {
  repeated Course courses = 1;
}

message Course {
  int32 course_id = 1;
  repeated Class classes = 2;
}

message Class {
  string class_id = 1;
  repeated Meeting meetings = 2;
}

message Meeting {
  repeated Day days = 1;
  int32 start_minute = 2;
  int32 end_minute = 3;
}

enum Day {
  DAY_UNSPECIFIED = 0;
  DAY_MONDAY = 1;
  DAY_TUESDAY = 2;
  DAY_WEDNESDAY = 3;
  DAY_THURSDAY = 4;
  DAY_FRIDAY = 5;
  DAY_SATURDAY = 6;
  DAY_SUNDAY = 7;
}

message GenerateSchedulesResponse {
  repeated Schedule schedules = 1;
}

message Schedule {
  repeated SelectedClass classes = 1;
}

message SelectedClass {
  int32 course_id = 1;
  string class_id = 2;
}
