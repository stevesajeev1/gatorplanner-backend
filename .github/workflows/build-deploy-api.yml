name: Deploy API to Production

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "deploy/api/Dockerfile"
      - "deploy/api/Dockerfile.migrations"
      - ".github/workflows/build-deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check changed files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            migrations:
              - 'api/internal/database/migrations/**'
              - 'deploy/api/Dockerfile.migrations'

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-24.04-arm
    needs: changes

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push API
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./deploy/api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gatorplanner-api:latest
            ghcr.io/${{ github.repository_owner }}/gatorplanner-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migrations
        if: needs.changes.outputs.migrations == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./deploy/api/Dockerfile.migrations
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gatorplanner-migrations:latest
            ghcr.io/${{ github.repository_owner }}/gatorplanner-migrations:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs:
      - changes
      - build-and-push

    steps:
      - name: Deploy API
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.PROD_HOST }}
          username: deploy
          key: ${{ secrets.PROD_SSH_KEY }}
          fingerprint: ${{ secrets.PROD_SSH_FINGERPRINT }}
          script: |
            set -e

            cd /opt/projects/gatorplanner

            docker compose up -d --wait postgres

            if [ "${{ needs.changes.outputs.migrations }}" = "true" ]; then
              docker run --rm \
                --network gatorplanner \
                --env-file .env \
                ghcr.io/${{ github.repository_owner }}/gatorplanner-migrations:${{ github.sha }}
            fi

            docker compose pull api

            docker compose up -d --no-deps --force-recreate api

            docker compose ps api