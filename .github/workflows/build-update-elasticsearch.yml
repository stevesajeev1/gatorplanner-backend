name: Update Elasticsearch in Production

on:
  push:
    branches:
      - main
    paths:
      - "elasticsearch/**"
      - "deploy/elasticsearch/Dockerfile"
      - ".github/workflows/build-update-elasticsearch.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Elasticsearch update
        uses: docker/build-push-action@v7
        with:
          context: ./elasticsearch
          file: ./deploy/elasticsearch/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gatorplanner-es-update:latest
            ghcr.io/${{ github.repository_owner }}/gatorplanner-es-update:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Update in Production
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Update Elasticsearch
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.PROD_HOST }}
          username: deploy
          key: ${{ secrets.PROD_SSH_KEY }}
          fingerprint: ${{ secrets.PROD_SSH_FINGERPRINT }}
          script: |
            set -e

            cd /opt/projects/gatorplanner

            docker compose up -d --wait elasticsearch

            docker run --rm \
              --network gatorplanner \
              --env-file .env \
              ghcr.io/${{ github.repository_owner }}/gatorplanner-es-update:${{ github.sha }}

            docker run --rm \
              --network gatorplanner \
              --env-file .env \
              ghcr.io/${{ github.repository_owner }}/gatorplanner-jobs:latest \
              python sync-elasticsearch.py spring 27