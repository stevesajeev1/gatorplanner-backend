name: Tests

on:
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/tests.yml"

jobs:
  test:
    name: Go
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Run tests
        working-directory: api
        run: go test ./...