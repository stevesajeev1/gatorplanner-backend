name: Validate Migrations

on:
  pull_request:
    paths:
      - "api/internal/database/migrations/**"
      - ".github/workflows/migrations.yml"

jobs:
  migrations:
    name: Validate PostgreSQL Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install Goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Validate migration files
        run: goose -dir api/internal/database/migrations validate

      - name: Run migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test?sslmode=disable
        run: |
          goose -dir api/internal/database/migrations postgres "$DATABASE_URL" up

      - name: Check migration status
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test?sslmode=disable
        run: |
          goose -dir api/internal/database/migrations postgres "$DATABASE_URL" status

      - name: Run migrations down
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test?sslmode=disable
        run: |
          goose -dir api/internal/database/migrations postgres "$DATABASE_URL" down-to 0

      - name: Run migrations up again
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test?sslmode=disable
        run: |
          goose -dir api/internal/database/migrations postgres "$DATABASE_URL" up